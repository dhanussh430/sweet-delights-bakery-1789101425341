

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Welcome to Sweet Delights Bakery"
  >

  <title>
    Sweet Delights Bakery
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="site-header">

  <div class="brand">

    <img
      src="data:image/svg+xml;base64,Cgo8c3ZnCiAgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIgogIHdpZHRoPSI4MCIKICBoZWlnaHQ9IjgwIgogIHZpZXdCb3g9IjAgMCA4MCA4MCI+CgogIDxyZWN0CiAgICB3aWR0aD0iODAiCiAgICBoZWlnaHQ9IjgwIgogICAgcng9IjE4IgogICAgZmlsbD0iI0ZGOEMwMCIKICAvPgoKICA8dGV4dAogICAgeD0iNTAlIgogICAgeT0iNTAlIgogICAgZm9udC1mYW1pbHk9IkFyaWFsIgogICAgZm9udC1zaXplPSIyOCIKICAgIGZvbnQtd2VpZ2h0PSJib2xkIgogICAgZmlsbD0id2hpdGUiCiAgICB0ZXh0LWFuY2hvcj0ibWlkZGxlIgogICAgZG9taW5hbnQtYmFzZWxpbmU9ImNlbnRyYWwiPgoKICAgIFNECgogIDwvdGV4dD4KCjwvc3ZnPgoK"
      alt="Sweet Delights Bakery logo"
    >

    <span class="brand-title">

      Sweet Delights Bakery

    </span>

  </div>


  <nav class="main-nav">

    

        <a
          href="#hero"
          class="nav-link"
          data-slide="hero">

          Welcome to Sweet Crumb Bakery

        </a>

      

        <a
          href="#menu"
          class="nav-link"
          data-slide="menu">

          Our Sweet Menu

        </a>

      

        <a
          href="#gallery"
          class="nav-link"
          data-slide="gallery">

          Bakery Gallery

        </a>

      

        <a
          href="#order-now"
          class="nav-link"
          data-slide="order-now">

          Order Fresh Baked Goods

        </a>

      

        <a
          href="#find-us"
          class="nav-link"
          data-slide="find-us">

          Find Our Bakery

        </a>

      

  </nav>

</header>


<main>

  

<section
  id="hero"
  class="site-slide hero-slide"
  data-index="0">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        01
      </span>

      <h2>
        Welcome to Sweet Crumb Bakery
      </h2>

      

      
            <button
              class="primary-btn"
              data-next>

              Explore More
              <span>→</span>

            </button>
          

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/16157286/pexels-photo-16157286.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="Close-up of raw dough balls and cornmeal in a bakery kitchen, ready for baking."
              loading="eager"
            >

          </div>

        


  </div>


  


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="menu"
  class="site-slide content-slide"
  data-index="1">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        02
      </span>

      <h2>
        Our Sweet Menu
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/18281679/pexels-photo-18281679.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="Beautiful pink and white cake decorated with a cross for a religious celebration."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="gallery"
  class="site-slide content-slide"
  data-index="2">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        03
      </span>

      <h2>
        Bakery Gallery
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/16157286/pexels-photo-16157286.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="Close-up of raw dough balls and cornmeal in a bakery kitchen, ready for baking."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="order-now"
  class="site-slide content-slide"
  data-index="3">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        04
      </span>

      <h2>
        Order Fresh Baked Goods
      </h2>

      

      

    </div>


    

          <div class="visual-placeholder">

            <div class="placeholder-icon">
              ✦
            </div>

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="find-us"
  class="site-slide content-slide"
  data-index="4">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        05
      </span>

      <h2>
        Find Our Bakery
      </h2>

      

      

    </div>


    

          <div class="visual-placeholder">

            <div class="placeholder-icon">
              ✦
            </div>

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

</section>

        

</main>


<div class="slide-dots">

  

        <button
          class="dot active"
          data-target="hero"
          aria-label="Go to Welcome to Sweet Crumb Bakery">
        </button>

      

        <button
          class="dot "
          data-target="menu"
          aria-label="Go to Our Sweet Menu">
        </button>

      

        <button
          class="dot "
          data-target="gallery"
          aria-label="Go to Bakery Gallery">
        </button>

      

        <button
          class="dot "
          data-target="order-now"
          aria-label="Go to Order Fresh Baked Goods">
        </button>

      

        <button
          class="dot "
          data-target="find-us"
          aria-label="Go to Find Our Bakery">
        </button>

      

</div>


<footer class="site-footer">

  

<div class="footer-contact">

  

  

  

  

</div>




  <p>

    © 2026 Sweet Delights Bakery

  </p>

</footer>


<script src="script.js"></script>


</body>

</html>
